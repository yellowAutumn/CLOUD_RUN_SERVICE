# This Cloud Build configuration builds your Docker image and pushes it to the repository.

steps:
# Step 1: Build the Docker image
# The '.' at the end indicates that the Dockerfile is in the current directory.
# '$PROJECT_ID' is a built-in Cloud Build substitution variable.
# We'll tag the image with a unique ID for Cloud Run deployment.
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/$PROJECT_ID/test-public-cloud-run-service-image:$COMMIT_SHA', '.'] # <<< UPDATED IMAGE NAME HERE

# Step 2: Push the Docker image to Google Container Registry (GCR) or Artifact Registry (AR)
# This step is implicit when using the 'images' field below, but explicitly showing it can be clearer for complex builds.
# The 'images' field below will handle the push automatically.
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/$PROJECT_ID/test-public-cloud-run-service-image:$COMMIT_SHA']

# 'images' specifies the Docker images that are built by the build and pushed to GCR/AR.
# Cloud Build automatically pushes these tagged images at the end of the build.
images:
- 'gcr.io/$PROJECT_ID/test-public-cloud-run-service-image:$COMMIT_SHA' # <<< UPDATED IMAGE NAME HERE

# Options for the entire build.
options:
  # This is crucial for resolving your previous error.
  # Choose ONE of the following logging options:
  # 1. Send logs to Cloud Logging (recommended for most cases):
  logging: CLOUD_LOGGING_ONLY
  # 2. Store logs in a specific GCS bucket (uncomment and replace if preferred):
  # logsBucket: 'gs://your-cloud-build-logs-bucket' # Make sure your Cloud Build service account has write access here

  # Optional: If you're using a custom service account for the build itself, uncomment and replace:
  # serviceAccount: 'projects/$PROJECT_ID/serviceAccounts/your-cloudbuild-custom-sa@$PROJECT_ID.iam.gserviceaccount.com'
  # Make sure this service account has permissions for building, pushing, and deploying to Cloud Run.